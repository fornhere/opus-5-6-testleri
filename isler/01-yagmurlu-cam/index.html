 vec3 w=refract(d,vec3(0,0,-1),1./ior);vec2 k=w.xy/w.z,q=p;
 for(int i=0;i<4;i++){q=p+k*max(D(q).x,0.);}
 s=D(q);vec3 N=normalize(vec3(-s.yz,1.));
 float ci=dot(w,N);if(ci<=.02)return ROOM;
 float s2=ior*ior*(1.-ci*ci);
 vec3 L=vec3(0);float F=1.;
 if(s2<1.){float ct=sqrt(1.-s2);F=fres(ci,ct,ior,1.);vec3 t=refract(w,-N,ior);L=env(t,.3)*(1.-F);}
 if(F>.03){ // iç yansıma
  vec3 r=reflect(w,N),P=vec3(q,max(s.x,0.));vec3 c=ROOM;float st=max(s.x,.05)*.22;P+=r*st*.6;bool done=false;
  for(int i=0;i<18;i++){P+=r*st;if(P.z<0.){c=ROOM*1.5;done=true;break;}vec4 e=D(P.xy);if(e.x<P.z){vec3 M=normalize(vec3(-e.yz,1.));float cm=dot(r,M);if(cm>0.){vec3 t=refract(r,-M,ior);if(dot(t,t)>.5)c=env(t,.8);}done=true;break;}}
  L+=c*F;}
 return L*.97+ROOM*.03;}
float blades(float a){const float n=7.;float s=6.2831853/n;return mix(1.,cos(s*.5)/cos(mod(a+.35,s)-s*.5),.55);}
void main(){
 ivec2 ip=ivec2(gl_FragCoord.xy);vec4 pv=texelFetch(uPrev,ip,0);
 uint h=hs(uint(ip.x)+uint(ip.y)*8192u);uvec4 sh=uvec4(h,hs(h+1u),hs(h+2u),hs(h+3u));
 float tx=tan(14.*.01745329),ty=tx*uRes.y/uRes.x;
 vec3 f=vec3(sin(YAW),0.,cos(YAW)),r=vec3(cos(YAW),0.,-sin(YAW)),u=vec3(0,1,0);
 float pit=.004;f=normalize(f+u*pit);u=normalize(u-f*dot(u,f));float rol=.012;vec3 r2=r*cos(rol)+u*sin(rol);u=u*cos(rol)-r*sin(rol);r=r2;
 vec3 C=-f*FOC;vec3 acc=vec3(0);
 for(int k=0;k<uK;k++){
  uint i=uint(uN+k);
  vec4 x=vec4(i*uvec4(3679390609u,3152041523u,2700274806u,2313257605u)+sh)*2.3283064e-10;
  vec2 j=vec2(x.x+x.y-1.,x.z*0.+fract(x.x*1.+x.y*7.31+float(h&255u)/255.)-.5);
  // piksel filtresi: çadır
  vec2 a=vec2(x.x,x.y);a=vec2(a.x<.5?sqrt(2.*a.x)-1.:1.-sqrt(2.-2.*a.x),a.y<.5?sqrt(2.*a.y)-1.:1.-sqrt(2.-2.*a.y))*.85;
  vec2 sc=((vec2(ip)+.5+a)/uRes*2.-1.);
  float lr=sqrt(x.z),la=6.2831853*x.w;float bl=blades(la);vec2 ln=lr*bl*vec2(cos(la),sin(la));
  float wt=.86+.30*pow(lr,5.)+.035*sin(lr*46.);
  // kedi gözü
  vec2 ce=ln+sc*vec2(.50,.34);wt*=smoothstep(1.13,1.07,length(ce));
  vec3 col=vec3(0);
  for(int c=0;c<3;c++){float cf=float(c)-1.;
   float ca=1.+cf*.00045*dot(sc,sc);float Fd=FOC*.977*(1.+.0011*cf);
   vec3 dirc=normalize(f+r*(sc.x*tx*ca)+u*(sc.y*ty*ca));
   vec3 Pf=C+dirc*(Fd/dot(dirc,f));vec3 Lp=C+(r*ln.x+u*ln.y)*3.5;vec3 d=normalize(Pf-Lp);
   float t=-Lp.z/d.z;vec3 g=glass((Lp+d*t).xy,d,1.3335+cf*.0032);col[c]=g[c];}
  acc+=min(col,vec3(90.))*wt;}
 o=pv+vec4(acc,float(uK));
}`;

/* ---------- 4. duyarga ---------- */
const RES_FS=`uniform sampler2D uPrev;out vec4 o;void main(){vec4 a=texelFetch(uPrev,ivec2(gl_FragCoord.xy),0);o=vec4(a.rgb/max(a.a,1.),1.);}`;
const POST_FS=`
uniform sampler2D uImg;uniform vec2 uRes;uniform float uExp;out vec4 o;
uint hs(uint x){x^=x>>16;x*=0x7feb352du;x^=x>>15;x*=0x846ca68bu;x^=x>>16;return x;}
float rn(ivec2 p,uint s){return float(hs(uint(p.x)+uint(p.y)*16384u+s*268435459u))*2.3283064e-10;}
float ga(ivec2 p,uint s){return (rn(p,s)+rn(p,s+1u)+rn(p,s+2u)+rn(p,s+3u)-2.)*1.73;}
float gs(ivec2 p,uint s){return ga(p,s)*.62+(ga(p+ivec2(1,0),s)+ga(p+ivec2(-1,0),s)+ga(p+ivec2(0,1),s)+ga(p+ivec2(0,-1),s))*.26;}
float gc(ivec2 p,uint s){float a=0.;for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++)a+=ga((p+ivec2(i,j)*1),s);return a/5.;}
vec3 tap(vec2 uv,float l){vec2 e=exp2(l)/uRes;vec3 c=vec3(0);for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){float w=(i==0?2.:1.)*(j==0?2.:1.);c+=w*textureLod(uImg,uv+vec2(i,j)*e,l).rgb;}return c/16.;}
float cur(float x){ // gölge + omuz
 x=max(x,0.);float a=.55;float y=x<a?x:a+(1.-a)*(1.-exp(-(x-a)/(1.-a)*.95));return y;}
void main(){
 ivec2 ip=ivec2(gl_FragCoord.xy);vec2 uv=gl_FragCoord.xy/uRes;
 vec3 c=texelFetch(uImg,ip,0).rgb;
 vec3 nb=texelFetch(uImg,ip+ivec2(1,0),0).rgb+texelFetch(uImg,ip-ivec2(1,0),0).rgb+texelFetch(uImg,ip+ivec2(0,1),0).rgb+texelFetch(uImg,ip-ivec2(0,1),0).rgb;
 vec3 sh=c*4.-nb;c+=clamp(sh*.10,-.25*c,.25*c);
 vec3 bl=tap(uv,4.)*.30+tap(uv,5.5)*.28+tap(uv,7.)*.24+tap(uv,8.5)*.18;
 c=mix(c,bl,.040);
 vec2 q=uv-.5;c*=1.-.32*dot(q,q);
 c*=uExp;
 // gürültü: foton + okuma
 float l=dot(c,vec3(.3,.6,.1));
 vec3 sg=sqrt(max(c,0.)*.00115+.0000135);
 c+=gs(ip,11u)*sg*.95+vec3(gc(ip,31u),gc(ip,41u)*.5,gc(ip,51u))*sg*.55;
 c=max(c,0.);
 // renk: hafif sinyal karışımı, ışıkta doygunluk kaybı
 c=mat3(1.10,-.03,-.01,-.08,1.07,-.09,-.02,-.04,1.10)*c;c=max(c,0.);
 c=vec3(cur(c.r),cur(c.g),cur(c.b));
 c=mix(12.92*c,1.055*pow(max(c,1e-5),vec3(1./2.4))-.055,step(.0031308,c));
 c=mix(c,c*c*(3.-2.*c),.50);c=max(vec3(0),(c-.012)*1.012);
 c+= (vec3(rn(ip,91u),rn(ip,92u),rn(ip,93u))-.5)/255.;
 o=vec4(c,1.);
}`;

/* ---------- yürüt ---------- */
async function run(){
 gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);
 const t0=performance.now();
 // ışık haritası
 const pe=prog(ENV_FS);let ta=tex(ENV_N,ENV_N,gl.RGBA32F,gl.RGBA,gl.FLOAT),tb=tex(ENV_N,ENV_N,gl.RGBA32F,gl.RGBA,gl.FLOAT);let fa=fbo(ta),fb=fbo(tb);
 gl.useProgram(pe.p);gl.viewport(0,0,ENV_N,ENV_N);gl.uniform4i(pe.u.uCnt,B.length,S.length,T.length,L.length);gl.uniform1f(pe.u.uYaw,27*Math.PI/180);
 bind(pe.u.uBox,tBox,1);bind(pe.u.uSph,tSph,2);bind(pe.u.uTre,tTre,3);bind(pe.u.uLmp,tLmp,4);
 gl.enable(gl.SCISSOR_TEST);let strips=16;
 for(let n=0;n<ENV_SPP;n++){bind(pe.u.uPrev,ta,0);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.uniform1i(pe.u.uN,n);const t=performance.now();let s=0;
  for(;s<strips;s++){const y0=Math.floor(ENV_N*s/strips),y1=Math.floor(ENV_N*(s+1)/strips);gl.scissor(0,y0,ENV_N,y1-y0);gl.drawArrays(gl.TRIANGLES,0,3);if(strips>1){sync();if((s&1)===1)await tick()}}
  sync();const dt=performance.now()-t;if(dt/strips>120)strips=Math.min(256,strips*2);else if(dt/strips<30&&strips>1)strips=Math.max(1,strips>>1);
  [ta,tb]=[tb,ta];[fa,fb]=[fb,fa];if(n>=31&&performance.now()-t0>45e3)n=ENV_SPP;bar.style.width=Math.min(10,10*(n+1)/ENV_SPP)+'%';await tick()}
 gl.disable(gl.SCISSOR_TEST);
 const pr=prog(RES_FS);const tEnv=tex(ENV_N,ENV_N,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,null,gl.LINEAR,true),fEnv=fbo(tEnv);
 gl.useProgram(pr.p);bind(pr.u.uPrev,ta,0);gl.bindFramebuffer(gl.FRAMEBUFFER,fEnv);gl.drawArrays(gl.TRIANGLES,0,3);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tEnv);gl.generateMipmap(gl.TEXTURE_2D);
 gl.deleteTexture(ta);gl.deleteTexture(tb);
 console.log('env',((performance.now()-t0)/1e3).toFixed(1),'kutu',B.length,'lamba',L.length);
 const pp=prog(POST_FS);
 const show=(t,w,h,exp)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,IMG_W,IMG_H);gl.useProgram(pp.p);bind(pp.u.uImg,t,0);gl.uniform2f(pp.u.uRes,IMG_W,IMG_H);gl.uniform1f(pp.u.uExp,exp);gl.drawArrays(gl.TRIANGLES,0,3)};
 const EXP=+(Q.get('exp')||1.35);
 // damlalar
 const t1=performance.now();const sim=makeDrops();console.log('sim',sim.all.length,((performance.now()-t1)/1e3).toFixed(1));await tick();
 const D=await rasterDrops(sim);console.log('raster',((performance.now()-t1)/1e3).toFixed(1));
 const tDrop=tex(TW,TH,gl.RGBA16F,gl.RGBA,gl.FLOAT,D,gl.LINEAR);
 // ana kare
 const pm=prog(MAIN_FS);let ma=tex(IMG_W,IMG_H,gl.RGBA32F,gl.RGBA,gl.FLOAT),mb=tex(IMG_W,IMG_H,gl.RGBA32F,gl.RGBA,gl.FLOAT);let ga=fbo(ma),gb=fbo(mb);
 gl.useProgram(pm.p);gl.viewport(0,0,IMG_W,IMG_H);bind(pm.u.uEnv,tEnv,1);bind(pm.u.uDrop,tDrop,2);gl.uniform2f(pm.u.uRes,IMG_W,IMG_H);gl.uniform4f(pm.u.uG,GX,GY,GW,GH);
 gl.enable(gl.SCISSOR_TEST);let K=2,ms=8,done=0;const t2=performance.now();
 while(done<SPP&&(done<320||performance.now()-t2<9e4)){const k=Math.min(K,SPP-done);gl.useProgram(pm.p);gl.viewport(0,0,IMG_W,IMG_H);bind(pm.u.uPrev,ma,0);bind(pm.u.uEnv,tEnv,1);bind(pm.u.uDrop,tDrop,2);gl.bindFramebuffer(gl.FRAMEBUFFER,gb);gl.uniform1i(pm.u.uN,done);gl.uniform1i(pm.u.uK,k);
  const t=performance.now();for(let s=0;s<ms;s++){const y0=Math.floor(IMG_H*s/ms),y1=Math.floor(IMG_H*(s+1)/ms);gl.scissor(0,y0,IMG_W,y1-y0);gl.drawArrays(gl.TRIANGLES,0,3);sync();if(performance.now()-t>60)await tick()}
  const dt=(performance.now()-t)/ms;if(dt>90){if(K>1)K=Math.max(1,K>>1);else ms=Math.min(128,ms*2)}else if(dt<28){if(ms>4)ms>>=1;else K=Math.min(16,K*2)}
  [ma,mb]=[mb,ma];[ga,gb]=[gb,ga];done+=k;bar.style.width=(40+60*done/SPP)+'%';await tick()}
 gl.disable(gl.SCISSOR_TEST);
 const tImg=tex(IMG_W,IMG_H,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,null,gl.LINEAR,true),fImg=fbo(tImg);
 gl.useProgram(pr.p);gl.viewport(0,0,IMG_W,IMG_H);bind(pr.u.uPrev,ma,0);gl.drawArrays(gl.TRIANGLES,0,3);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tImg);gl.generateMipmap(gl.TEXTURE_2D);
 show(tImg,IMG_W,IMG_H,EXP);
 console.log('render',((performance.now()-t2)/1e3).toFixed(1),'toplam',((performance.now()-t0)/1e3).toFixed(1));
 document.getElementById('b').style.opacity=0;cv.classList.add('ok');window.__done=true;
}
run().catch(e=>{console.error(e);if(!window.__err)say('Hata: '+e)});
})();
