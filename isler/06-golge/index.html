<script>
"use strict";
const GLSL_HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2DShadow;
`;
const GLSL_COMMON = `
uniform mat4 uVP; uniform vec3 uCam; uniform float uT;
uniform vec3 uSunDir,uSunCol,uAmbU,uAmbD,uFog,uFogSun; uniform vec2 uFogP;
uniform mat4 uSVP; uniform sampler2DShadow uSh; uniform vec2 uShP;
uniform vec4 uOcc[4];
uniform vec4 uSnowP;    // coverage, keepRock, keepTree, front
uniform vec4 uBare;     // radius, amount, crack, wet
uniform vec4 uTreeP;    // H,R,h0,trunk
uniform vec4 uRockP;
uniform vec3 uKeepDir;
uniform vec4 uWind;     // xyz dir*strength, phase
uniform vec4 uDent[6];  // x,z,r,depth
float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float h21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 h22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float h31(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float vn3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
 mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=mat2(1.6,1.2,-1.2,1.6)*p+7.3;a*=.5;}return s/.9375;}
float terr(vec2 p){float r2=dot(p,p);
 float h=3.4*exp(-r2/420.)-3.4;
 float w=smoothstep(4.,200.,r2);
 h+=w*(.30*sin(p.x*.19+.6)*cos(p.y*.16-.3)+.12*sin(p.x*.43-p.y*.31+1.));
 h+=.030*sin(p.x*.9+p.y*.6)*sin(p.y*1.1-p.x*.35+.7);
 h+=smoothstep(900.,6000.,r2)*(2.2*sin(p.x*.05+1.3)*cos(p.y*.043)+1.);
 return h;}
float treeShade(vec3 p){ if(uTreeP.x<.5) return 0.;
 vec2 d=-uKeepDir.xz/uKeepDir.y; p.xz+=d*p.y; float H=uTreeP.x,R=uTreeP.y,h0=uTreeP.z; vec2 c0=d*h0,a=d*H; vec2 ab=a-c0; float t=dot(p.xz-c0,ab)/dot(ab,ab); float tc=clamp(t,0.,1.);
 float tier=fract(tc*5.5); float r=R*pow(1.-tc,.92)*(.90+.20*(1.-tier))+.02; float ds=length(p.xz-c0-ab*tc)-r; ds+=(vn(p.xz*2.3)-.5)*.16;
 float base=length(p.xz)-.8; ds=min(ds,base);
 return smoothstep(.22,-.22,ds);}
float rockShade(vec3 p){ vec3 L=uKeepDir; vec3 o=uRockP.xyz-p; float b=max(dot(o,L),0.); float d=length(o-L*b)-uRockP.w*.94;
 return smoothstep(.16,-.30,d);}
float snowRaw(vec3 p){
 float c=uSnowP.x; float r=length(p.xz);
 if(uSnowP.w>0.){ float rr=length(p.xz-vec2(-1.48,1.83)); c=min(c,mix(-.35,1.3,smoothstep(uSnowP.w+2.2,uSnowP.w-.4,rr))); }
 if(uSnowP.y>0.) c=max(c,rockShade(p)*uSnowP.y*1.35);
 if(uSnowP.z>0.) c=max(c,treeShade(p)*uSnowP.z*1.35);
 c-=uBare.y*exp(-r*r/(uBare.x*uBare.x+1e-4));
 return c;}
float snowCov(vec3 p){
 float fr2=smoothstep(16.,6.,length(p.xz)); float n=fbm(p.xz*mix(.36,.62,fr2)+3.1)*mix(.86,.62,fr2)+vn(p.xz*mix(1.2,2.7,fr2))*mix(.14,.24,fr2)+vn(p.xz*8.3)*.14*fr2;
 n=clamp((n-.5)*1.35+.5,.02,.98);
 return smoothstep(n-.06,n+.06,snowRaw(p));}
float dents(vec2 p){float d=0.;for(int i=0;i<6;i++){vec2 q=p-uDent[i].xy;float r=uDent[i].z;d-=uDent[i].w*exp(-dot(q,q)/(r*r+1e-5));}return d;}
`;
const GLSL_LIGHT = `
float ign(vec2 p){return fract(52.9829189*fract(dot(p,vec2(.06711056,.00583715))));}
float shadowAt(vec3 P,vec3 N){
 vec4 s=uSVP*vec4(P+N*.02,1.); vec3 c=s.xyz/s.w*.5+.5; if(c.z>1.||any(lessThan(c.xy,vec2(0)))||any(greaterThan(c.xy,vec2(1)))) return 1.;
 float a=ign(gl_FragCoord.xy)*6.2831; float sum=0.; float rad=uShP.x;
 for(int i=0;i<12;i++){float fi=float(i)+.5; float r=sqrt(fi/12.)*rad; float th=a+fi*2.39996; sum+=texture(uSh,vec3(c.xy+vec2(cos(th),sin(th))*r,c.z-.0012));}
 float e=max(abs(c.x-.5),abs(c.y-.5)); return mix(1.,mix(sum/12.,1.,smoothstep(.42,.5,e)),uShP.y);}
float sphOcc(vec3 P,vec3 N,vec4 s){ if(s.w<.01) return 1.; vec3 d=s.xyz-P; float l=length(d); float nl=dot(N,d)/l; float h=l/s.w; float h2=h*h; float k=1.-h2*nl*nl;
 float r=max(0.,nl)/h2; if(k>0.){ r=nl*acos(clamp(-nl*sqrt((h2-1.)/max(1.-nl*nl,1e-4)),-1.,1.))-sqrt(max(k*(h2-1.),0.)); r=r/h2+atan(sqrt(max(k,0.)/max(h2-1.,1e-4))); r/=3.14159; }
 return 1.-clamp(r,0.,1.);}
float occAll(vec3 P,vec3 N){float o=1.;for(int i=0;i<4;i++){vec4 s=uOcc[i]; if(s.w<.01) continue; vec3 d=s.xyz-P; float l2=dot(d,d); float nl=max(dot(N,d)/sqrt(l2),0.); o*=1.-clamp(nl*s.w*s.w/l2,0.,.92);}return o;}
vec3 fogIt(vec3 c,vec3 P){vec3 d=P-uCam; float l=length(d); d/=l; float f=1.-exp(-l*uFogP.x*exp(-max(P.y,0.)*uFogP.y)); float m=max(dot(d,uSunDir),0.); vec3 fc=mix(uFog,uFogSun,pow(m,6.)); return mix(c,fc,clamp(f,0.,1.));}
vec3 ambient(vec3 N){return mix(uAmbD,uAmbU,N.y*.5+.5);}
float sparkle(vec3 P,vec3 V,vec3 L){ vec3 q=P*70.; vec3 i=floor(q); float h=h31(i); vec3 rn=normalize(vec3(h31(i+7.1),h31(i+3.7),h31(i+9.3))-.5+vec3(0,.35,0)); vec3 H=normalize(L+V); float d=max(dot(rn,H),0.); vec3 f=fract(q)-.5; return step(.72,h)*pow(d,220.)*smoothstep(.5,.1,length(f))*9.;}
vec3 snowLit(vec3 alb,vec3 P,vec3 N,vec3 V,float sh,float ao){
 float nl=dot(N,uSunDir); float w=clamp((nl+.28)/1.28,0.,1.); w=mix(w*w,w,.45);
 vec3 c=alb*(uSunCol*w*sh+ambient(N)*ao);
 // subsurface bleed
 float tr=pow(clamp(dot(-V,uSunDir)*.5+.5,0.,1.),3.)*clamp(.6-nl,0.,1.);
 c+=alb*uSunCol*tr*.22*(.35+.65*sh)*vec3(1.,.93,.86);
 float fr=pow(1.-max(dot(N,V),0.),4.); c+=fr*uAmbU*.28*ao;
 c+=uSunCol*sparkle(P,V,uSunDir)*sh*smoothstep(0.,.3,nl);
 return c;}
`;
const SH = {};
SH.skyVS = GLSL_HEAD+`layout(location=0) in vec3 aP; out vec2 vU; void main(){vU=aP.xy; gl_Position=vec4(aP.xy,.99999,1.);}`;
SH.skyFS = GLSL_HEAD+GLSL_COMMON+`
in vec2 vU; out vec4 o; uniform mat4 uIVP; uniform vec3 uZen,uHor,uGlow,uCloud,uCloudS,uMtn,uMtnS; uniform vec4 uSky; // stars, moon, cloudAmt, cloudTime
uniform vec3 uMoonDir; uniform vec3 uDisc; uniform float uHaze;
float ridge(float x,float s){return fbm(vec2(x*s,s*1.7));}
void main(){
 vec4 a=uIVP*vec4(vU,1.,1.); vec3 d=normalize(a.xyz/a.w-uCam);
 float el=d.y; vec3 c=mix(uHor,uZen,pow(smoothstep(-.02,.62,el),.62));
 float mu=max(dot(d,uDisc),0.);
 c+=uGlow*(pow(mu,5.)*.22+pow(mu,28.)*.45+pow(mu,220.)*1.2);
 c+=uGlow*smoothstep(.9990,.9994,mu)*9.*step(.01,uGlow.r);
 // stars
 if(uSky.x>.01){ vec2 q=vec2(atan(d.x,-d.z)*60.,asin(clamp(d.y,-1.,1.))*60.); vec2 i=floor(q); vec2 r=h22(i); vec2 f=fract(q)-.5-(r-.5)*.7; float b=pow(h21(i+9.),14.); float tw=.65+.35*sin(uT*(1.+r.x*3.)+r.y*40.); float st=smoothstep(.10+.10*b,.0,length(f)); c+=uSky.x*st*(b*3.2+.10*step(.8,h21(i+2.)))*tw*vec3(.8,.9,1.2)*smoothstep(.0,.25,el);
  vec2 q2=q*2.3; vec2 i2=floor(q2); vec2 f2=fract(q2)-.5-(h22(i2+4.)-.5)*.8; c+=uSky.x*smoothstep(.12,0.,length(f2))*step(.90,h21(i2+5.))*.22*vec3(.8,.9,1.2)*smoothstep(.05,.3,el); }
 // moon
 if(uSky.y>.01){ float m=dot(d,uMoonDir); c+=uSky.y*vec3(.55,.75,1.1)*(pow(max(m,0.),24.)*.10+pow(max(m,0.),400.)*.35); float ang=acos(clamp(m,-1.,1.)); float disc=smoothstep(.0315,.0300,ang); vec3 rx=normalize(cross(uMoonDir,vec3(0,1,0))); vec3 ry=cross(rx,uMoonDir); vec2 mp=vec2(dot(d,rx),dot(d,ry))/.031; float cr=fbm(mp*1.9+4.); c=mix(c,vec3(1.35,1.42,1.5)*(.72+.45*smoothstep(.3,.65,cr)),disc*uSky.y); }
 // clouds
 if(uSky.z>.01 && el>.0){ vec2 q=d.xz/(el+.16)*1.15+vec2(uSky.w,uSky.w*.3); float n=fbm(q)*.65+fbm(q*2.7+3.)*.35; float cv=smoothstep(.62-.34*uSky.z,.92-.30*uSky.z,n); float n2=fbm(q+uDisc.xz*.22)*.65+fbm((q+uDisc.xz*.22)*2.7+3.)*.35; float li=clamp(.55+(n-n2)*3.2,0.,1.); vec3 cc=mix(uCloudS,uCloud,li)+uGlow*pow(mu,8.)*.3; c=mix(c,cc,cv*smoothstep(.0,.16,el)*.92*min(1.,uSky.z*2.)); }
 // mountains (painted)
 float az=atan(d.x,-d.z);
 for(int i=0;i<3;i++){ float fi=float(i); float s=3.1+fi*1.7; float base=.150-.042*fi; vec2 q=vec2(az*s+fi*5.3,fi*1.7); q.x+=(fbm(vec2(az*s*3.,fi*3.+9.))-.5)*.35; q.y+=(vn(vec2(az*s*2.3,fi+4.))-.5)*.5; float r1=1.-abs(2.*vn(q)-1.),r2=1.-abs(2.*vn(q*2.1+3.)-1.),r3=1.-abs(2.*vn(q*4.7+7.)-1.),r4=vn(q*11.);
  float v0=vn(q*.9+1.3); float prof=base*(.10+.72*v0+.34*r2*(.35+.65*v0)+.12*r3)+.006*r4-.050+(fi>1.5?-.014:0.);
  float k=prof-el; float m=smoothstep(0.,.0015,k); if(m>0.){ vec2 u=vec2(az*s*3.4+fi*9.,el*(30.+fi*10.)); u+=(vec2(fbm(u*1.1+2.),fbm(u*1.1+8.))-.5)*1.1; u.x+=el*s*5.*clamp((vn(vec2(az*s*1.3,fi+2.))-.5)*3.,-1.,1.); float e=.22; float a0=(1.-abs(2.*vn(u)-1.))*.6+(1.-abs(2.*vn(u*2.3+4.)-1.))*.3+vn(u*6.)*.12; vec2 o2=vec2(uDisc.x>=0.?e:-e,-e*.6); vec2 u2=u+o2; float a1=(1.-abs(2.*vn(u2)-1.))*.6+(1.-abs(2.*vn(u2*2.3+4.)-1.))*.3+vn(u2*6.)*.12; float lit=clamp(.48+(a0-a1)*1.9,0.,1.); float snow=smoothstep(.30,.62,a0+.35-smoothstep(.01,.085-.012*fi,k)*.55); vec3 mc=mix(uMtn*(.45+.7*lit),uMtnS*(.40+.85*lit),snow); float hz=clamp(uHaze*(.80-.16*fi)+smoothstep(.015,.095,k)*.42,0.,1.); mc=mix(mc,mix(uFog,uFogSun,pow(mu,6.)),hz); c=mix(c,mc,m);} }
 float hzb=smoothstep(.06,-.07,el); c=mix(c,mix(uFog,uFogSun,pow(mu,6.)),hzb*.85);
 o=vec4(c,1.);
}`;
SH.gndVS = GLSL_HEAD+GLSL_COMMON+`
layout(location=0) in vec3 aP; out vec3 vP; out vec3 vN; out float vC;
void main(){ vec2 x=aP.xz; float h=terr(x); vec3 P=vec3(x.x,h,x.y); float c=snowCov(P); float e=.12; float hx=terr(x+vec2(e,0)),hz=terr(x+vec2(0,e)); vN=normalize(vec3(h-hx,e,h-hz)); P.y+=c*.085+dents(x)*c+ (length(x)<16.?(vn(x*1.7)-.5)*.05*c:0.); vP=P; vC=c; gl_Position=uVP*vec4(P,1.); }`;
SH.gndFS = GLSL_HEAD+GLSL_COMMON+GLSL_LIGHT+`
in vec3 vP; in vec3 vN; in float vC; out vec4 o; uniform vec3 uGrassA,uGrassB; uniform vec4 uFoot[18]; uniform int uFootN; uniform float uGreen; uniform vec4 uWet; // x,z,r,amt
vec2 voro(vec2 p){vec2 i=floor(p),f=fract(p);float a=9.,b=9.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(x,y);vec2 r=g+h22(i+g)-f;float d=dot(r,r);if(d<a){b=a;a=d;}else if(d<b)b=d;}return vec2(sqrt(a),sqrt(b));}
float hgt(vec2 x,float c){ return fbm(x*1.35)*.26*c+fbm(x*5.5)*.055+vn(x*23.)*.008*c+dents(x)*c; }
void main(){
 vec3 V=normalize(uCam-vP); float dist=length(uCam-vP); float fine=smoothstep(26.,5.,dist);
 float c=snowCov(vP);
 vec2 x=vP.xz; float e=.03+dist*.0025; float cR=snowCov(vP+vec3(e,0,0)),cU=snowCov(vP+vec3(0,0,e));
 float h0=hgt(x,c)+c*.10,hx=hgt(x+vec2(e,0),c)+cR*.10,hz=hgt(x+vec2(0,e),c)+cU*.10;
 vec3 N=normalize(vN+vec3(h0-hx,0.,h0-hz)/e*mix(.25,.9,fine));
 float footD=0.;
 for(int i=0;i<uFootN;i++){ vec2 q=x-uFoot[i].xy; float ca=cos(uFoot[i].z),sa=sin(uFoot[i].z); q=mat2(ca,sa,-sa,ca)*q; q/=vec2(.115,.20); float d=length(q); float f=smoothstep(1.2,.7,d); footD=max(footD,f*uFoot[i].w); vec2 g=q/max(d,.01); g=mat2(ca,-sa,sa,ca)*g; N=normalize(N+vec3(g.x,0,g.y)*smoothstep(.25,0.,abs(d-.95))*.9*uFoot[i].w); }
 float sh=shadowAt(vP,N); float ao=occAll(vP,N);
 // ground
 float gn=fbm(x*.8+9.); float gn2=vn(x*6.)*.5+vn(x*17.)*.5;
 vec3 soil=mix(vec3(.085,.058,.040),vec3(.165,.120,.085),gn2);
 vec3 grass=mix(uGrassA,uGrassB,clamp(gn*1.2+gn2*.3-.25,0.,1.))*(.6+.4*gn2);
 float far=smoothstep(15.,30.,length(x)); grass=mix(grass,uGrassA*vec3(.55,.62,.75),far*smoothstep(.50,.60,fbm(x*.11+2.)+.12*(fbm(x*.9)-.5))*.85); grass*=mix(1.,.72+.55*fbm(x*.3+5.),far);
 float gmask=uGreen*smoothstep(.15,.5,gn2*.35+gn*.75+.15*uGreen);
 float r=length(x); float patchR=smoothstep(uBare.x*1.15,uBare.x*.55,r+ (vn(x*4.)-.5)*.4)*uBare.y;
 gmask*=1.-patchR;
 vec3 alb=mix(soil,grass,gmask);
 float spec=0.;
 if(uBare.z>.01){ vec2 v=voro(x*4.6+(vec2(vn(x*9.),vn(x*9.+5.))-.5)*.5); float cr=smoothstep(.10,.02,v.y-v.x); alb=mix(alb,mix(vec3(.25,.195,.145),vec3(.33,.26,.19),gn2)*(1.-.72*cr),patchR*uBare.z); }
 float wr=length(x-uWet.xy)+(vn(x*5.)-.5)*.22; float wet=smoothstep(uWet.z,uWet.z*.55,wr)*uWet.w; wet=max(wet,smoothstep(.0,.6,c)*.5*(1.-c));
 alb*=1.-.52*wet; spec=wet;
 vec3 Ng=normalize(vN+vec3(gn2-.5,0.,vn(x*13.)-.5)*.35*fine);
 float nl=max(dot(Ng,uSunDir),0.);
 vec3 gc=alb*(uSunCol*nl*sh+ambient(Ng)*ao);
 vec3 H=normalize(V+uSunDir); gc+=spec*uSunCol*sh*pow(max(dot(normalize(mix(Ng,vec3(0,1,0),.7)),H),0.),60.)*.9+spec*uAmbU*pow(1.-max(dot(Ng,V),0.),5.)*.22;
 // snow
 vec3 sa=vec3(.90,.935,.985)*(1.-.50*footD); float sao=ao*mix(1.,.55,footD);
 vec3 sc=snowLit(sa,vP,N,V,sh*(1.-.5*footD),sao);
 float edge=c*(1.-c)*4.; sc*=1.-.12*edge;
 vec3 col=mix(gc,sc,c);
 o=vec4(fogIt(col,vP),1.);
}`;
SH.stdVS = GLSL_HEAD+GLSL_COMMON+`
layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec2 aU;
uniform mat4 uM; uniform int uDef; uniform vec4 uA,uB,uE; uniform vec3 uTail[14]; uniform vec3 uTailN[14];
out vec3 vP,vN,vO; out vec2 vU; out vec3 vOP;
vec3 ball(vec3 d){ float n=vn3(d*2.1+uA.z)*.5+vn3(d*5.3+uA.z*1.7)*.22; float r=1.+(n-.36)*uB.x; float m=uA.y; vec3 q=d*r;
 float low=smoothstep(.35,-1.,d.y); q.xz*=1.+m*.62*low; float an=atan(d.x,d.z); float rg=vn(vec2(an*5.+uA.z*3.,d.y*1.3-m*1.5)); q.xz*=1.-m*.26*rg*smoothstep(1.,-.1,d.y); q.y-=m*.10*rg*smoothstep(-.2,.8,d.y); if(q.y<0.) q.y*=1.-m*.30; return q*uA.x; }
void main(){ vec3 p=aP,n=aN; vO=aP; vU=aU;
 if(uDef==1){ vec3 d=normalize(aP); vec3 t=normalize(abs(d.y)<.95?cross(d,vec3(0,1,0)):cross(d,vec3(1,0,0))); vec3 b=cross(d,t); float e=.05; p=ball(d); vec3 p1=ball(normalize(d+t*e)),p2=ball(normalize(d+b*e)); n=normalize(cross(p1-p,p2-p)); if(dot(n,d)<0.) n=-n; vO=d; }
