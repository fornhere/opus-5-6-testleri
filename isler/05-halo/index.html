:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Halo Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#film{display:block;background:#000}
.hidecursor,.hidecursor *{cursor:none}
.ui{position:fixed;z-index:3;appearance:none;border:0;color:#fff;font:500 14px/1 "Halo Sans",system-ui,sans-serif;letter-spacing:.01em;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 15px;border-radius:999px;background:rgba(20,20,22,.55);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1),background .2s;transform:translateY(8px)}
.ui.on{opacity:1;pointer-events:auto;transform:none}
.ui:hover{background:rgba(60,60,64,.65)}
.ui:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ui svg{width:18px;height:18px;flex:none}
#snd{right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom))}
#again{left:50%;bottom:max(32px,env(safe-area-inset-bottom));margin-left:-74px;width:148px;justify-content:center;padding:0}
#load{position:fixed;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;border:1.5px solid rgba(255,240,222,.14);transition:opacity .5s}
#load::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid transparent;border-top-color:#fff1df;animation:sp 1.1s linear infinite}
#load.off{opacity:0;pointer-events:none}
@keyframes sp{to{transform:rotate(1turn)}}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:32px;color:#ddd;font-size:16px;line-height:1.6}
</style>
</head>
<body>
<div id="stage"><canvas id="film" role="img" aria-label="Halo akıllı gözlük tanıtım filmi"></canvas></div>
<div id="load" aria-hidden="true"></div>
<button class="ui" id="snd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9a4.2 4.2 0 0 1 0 6M18.8 6.4a8 8 0 0 1 0 11.2"/></svg><span>Sesi aç</span></button>
<button class="ui" id="again" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5L4.5 8.8"/><path d="M4.5 4.3v4.5H9"/></svg><span>Tekrar izle</span></button>
<div id="err"></div>
<script>
'use strict';
/* ------------------------------------------------------------------ *
 *  MÜZİK — hiçbir ses dosyası yok. Her örnek bu fonksiyonda hesaplanır
 *  (Worker içinde). 128 BPM · 16 ölçü · 64 vuruş = tam 30 saniye.
 * ------------------------------------------------------------------ */

    if (!vib) for (let i = 0; i < n; i++) { const k = p | 0; const a = tab[k]; dst[i] += g * (a + (tab[k + 1] - a) * (p - k)); p += inc; if (p >= TS) p -= TS; }
    else { const vs = rnd() * 6; for (let i = 0; i < n; i++) { const k = p | 0; const a = tab[k]; dst[i] += g * (a + (tab[k + 1] - a) * (p - k)); const t = i * DT; p += inc * (1 + vib * Math.min(1, t / vd) * Math.sin(TAU * vf * t + vs)); if (p >= TS) p -= TS; } } }

  function svf(d, mode, fc, q) { // 0 lp · 1 bp · 2 hp ; fc sayı ya da f(t)
    const fn = typeof fc === 'function'; let i1 = 0, i2 = 0, a1 = 0, a2 = 0, a3 = 0; const k = 1 / q;
    const set = f => { const g = Math.tan(Math.PI * Math.min(0.47, f / SR)); a1 = 1 / (1 + g * (g + k)); a2 = g * a1; a3 = g * a2; };
    if (!fn) set(fc);

  const shape = (d, fn) => { for (let i = 0; i < d.length; i++) d[i] *= fn(i * DT); return d; };
  const decay = (a, tau) => t => (t < a ? t / a : Math.exp(-(t - a) / tau));
  const ahr = (a, hold, r) => t => (t < a ? t / a : t < hold ? 1 : Math.exp(-(t - hold) / r));
  function put(d, dR, pos, g, pan, o) { // o: {d:bus, v:verb, e:delay, r:room}
    const gl = g * Math.cos((pan + 1) * Math.PI / 4) * 1.2, gr = g * Math.sin((pan + 1) * Math.PI / 4) * 1.2, n = Math.min(d.length, N - pos), R = dR || d;
    const tgt = []; if (o.d) tgt.push([o.d, 1]); if (o.v) tgt.push([verb, o.v]); if (o.e) tgt.push([dly, o.e]); if (o.r) tgt.push([room, o.r]);

  /* --- davul -------------------------------------------------------- */
  const pumps = [], pump = (b, depth = 0.3, rel = 0.13) => pumps.push([at(b), depth, rel]);
  function kick(b, v = 1, f1 = 47) { const d = tmp(0.5); glide(d, SIN, t => f1 + 120 * Math.exp(-t / 0.013) + 34 * Math.exp(-t / 0.055), 1, 0); shape(d, t => Math.min(1, t / 0.001) * (t < 0.06 ? 1 : Math.exp(-(t - 0.06) / 0.085)));
    for (let i = 0; i < d.length; i++) d[i] = Math.tanh(d[i] * 1.5) / 0.905; const c = tmp(0.03); noise(c, 0.5); svf(c, 2, 2200, 0.7); shape(c, decay(0.0004, 0.004)); for (let i = 0; i < c.length; i++) d[i] += c[i]; put(d, null, at(b), 0.62 * v, 0, { d: drums }); }

    const l = tmp(.9), r = tmp(.9); for (const n of [l, r]) { noise(n, 1); glide(n, SAW[1], t => 42 + 90 * Math.exp(-t / .05), .5); svf(n, 0, t => 180 + 900 * Math.exp(-t / .09), .8); shape(n, decay(.001, .16)); } put(l, r, at(b), .42 * v, 0, { d: fx, v: .9 }); }
