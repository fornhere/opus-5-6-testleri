<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gece Yağmuru</title>
<style>
:root{--ink:#eef2f6;--dim:rgba(238,242,246,.62);--line:rgba(238,242,246,.22)}
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:"Helvetica Neue","Inter","Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity .5s}
#ui.off{opacity:0}
#hud{position:absolute;right:max(34px,env(safe-area-inset-right));bottom:30px;text-align:right;text-shadow:0 1px 14px rgba(0,0,0,.65);opacity:0;transition:opacity .9s}
#spd{font-size:74px;font-weight:200;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
#unit{font-size:12px;color:var(--dim);margin-top:6px;display:flex;justify-content:flex-end;gap:12px;align-items:center}
#gear{color:var(--ink);font-weight:600;font-size:14px;min-width:12px;text-align:center}
#rev{width:176px;height:2px;background:var(--line);margin-top:12px;margin-left:auto;position:relative;overflow:hidden}
#rev i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
#rev.red i{background:#ff4a3a}
#toast{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);font-size:14px;color:var(--ink);text-shadow:0 1px 12px #000;opacity:0;transition:opacity .35s;white-space:nowrap}
#title{position:absolute;left:clamp(24px,6vw,96px);bottom:clamp(40px,9vh,110px);transition:opacity 1s}
#title h1{font-weight:200;font-size:clamp(44px,7.2vw,112px);letter-spacing:-.05em;line-height:.92;margin:0;text-shadow:0 2px 40px rgba(0,0,0,.55)}
#go{pointer-events:auto;margin-top:30px;appearance:none;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:13px 26px;cursor:pointer;backdrop-filter:blur(8px);transition:background .25s,border-color .25s}
#go:hover,#go:focus-visible{background:rgba(238,242,246,.14);border-color:var(--ink);outline:none}
#help{position:absolute;left:clamp(24px,3vw,40px);bottom:30px;font-size:13px;line-height:1.75;color:var(--dim);text-shadow:0 1px 10px #000;opacity:0;transition:opacity .8s;display:grid;grid-template-columns:auto auto;column-gap:16px}
#help b{font-weight:600;color:var(--ink)}
#fps{position:absolute;right:16px;top:12px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;display:none}
#load{position:fixed;inset:0;background:#05060a;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim);transition:opacity 1.2s;pointer-events:none}
#touch{position:absolute;inset:0;display:none}
#touch div{position:absolute;bottom:26px;width:86px;height:86px;border:1px solid var(--line);border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim);background:rgba(0,0,0,.18);touch-action:none}
@media (pointer:coarse){#touch.on{display:block}#help{display:none}#hud{bottom:auto;top:20px}}
@media (max-width:640px){#spd{font-size:52px}#rev{width:120px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
  <div id="title"><h1>Gece<br>Yağmuru</h1><button id="go">Arabayı çalıştır</button></div>
  <div id="hud"><div id="spd">0</div><div id="unit"><span>km/sa</span><span id="gear">1</span></div><div id="rev"><i></i></div></div>
  <div id="help"></div><div id="toast"></div><div id="fps"></div>
  <div id="touch"><div data-k="L" style="left:22px">sol</div><div data-k="R" style="left:122px">sağ</div><div data-k="B" style="right:122px">fren</div><div data-k="G" style="right:22px">gaz</div></div>
</div>
<div id="load">Şehir kuruluyor</div>

const S = 1024;            // dünya bu periyotla sonsuza dek tekrarlar (m)

const NB = S / PITCH;
const TAU = Math.PI * 2;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const wrapS = d => d - S * Math.round(d / S);
const mod = (a, n) => ((a % n) + n) % n;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function RNG(seed) {
  let a = seed >>> 0;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.r = (a, b) => a + (b - a) * f();
  f.i = (a, b) => Math.floor(a + (b - a + 1) * f());
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  return f;
}

    lay.forEach(([n, A, B], i) => { if (i < 5) { f += a * noise(A, n, x / N * n, y / N * n); sa += a; a *= .5; } if (i > 1) { g += b * noise(B, n, x / N * n, y / N * n); sb += b; b *= .62; } });

const Lights = {
  list: [],
  // grid uzayı konumu; type: 'spot' | 'hemi' | 'tube'
  add(x, y, z, col, I, range, type, dir = [0, -1, 0], hl = 0) {
    const [wx, wz] = toWorld(x, z); const b = bendD(z);
    let d = [dir[0] + b * dir[2], dir[1], dir[2]]; const l = Math.hypot(...d) || 1; d = d.map(v => v / l);
    this.list.push({ p: [mod(wx, S), y, mod(wz, S)], c: col.map(v => v * I), range, type, d, hl });
  },
  build() {
    const L = this.list, n = L.length, rows = Math.ceil(n / 128);
    const A = new Float32Array(384 * rows * 4);
    const cells = Array.from({ length: NC * NC }, () => []);
    const gi = new Float32Array(NC * NC * 3);
    L.forEach((l, i) => {
      const o = (Math.floor(i / 128) * 384 + (i % 128) * 3) * 4;
      A.set([...l.p, l.range], o); A.set([...l.c, l.type === 'spot' ? 1 : l.type === 'hemi' ? 0 : -1], o + 4); A.set([...l.d, l.type === 'tube' ? l.hl : 0], o + 8);
      const I = (l.c[0] + l.c[1] + l.c[2]) / 3, r = Math.ceil(l.range / CELL), cx = Math.floor(l.p[0] / CELL), cz = Math.floor(l.p[2] / CELL);
      for (let j = -r; j <= r; j++) for (let k = -r; k <= r; k++) {
        const x0 = (cx + k) * CELL, z0 = (cz + j) * CELL;
        const dx = Math.max(x0 - l.p[0], 0, l.p[0] - x0 - CELL), dz = Math.max(z0 - l.p[2], 0, l.p[2] - z0 - CELL), d2 = dx * dx + dz * dz;
        if (d2 > l.range * l.range) continue;
        const w = I * (1 - d2 / (l.range * l.range)) / (d2 + 9);
        cells[mod(cz + j, NC) * NC + mod(cx + k, NC)].push([w, i]);
      }
      const gr = 5; for (let j = -gr; j <= gr; j++) for (let k = -gr; k <= gr; k++) {
        const dx = (cx + k + .5) * CELL - l.p[0], dz = (cz + j + .5) * CELL - l.p[2], d2 = dx * dx + dz * dz, w = .00042 * Math.exp(-d2 / 420);
